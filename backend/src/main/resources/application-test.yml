spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    platform: h2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

api:
  security:
    token:
      secret: ${JWT_SECRET:my-test-secret-key-that-is-long-enough-for-hmac-sha-256}
      expiration: 2
